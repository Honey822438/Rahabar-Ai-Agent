# Golden set (section 5.1). Answers taken from reading the source documents, not from retrieved chunks.
# DRAFT: 17 questions (8 ordinary + 2 spare, 2 exact, 2 version, 2 abstain, 1 injection).
# `section` values are the document's own clause/heading; they must be matched to the indexer's stored section strings before the eval is run.

questions:
  - id: q01
    type: ordinary
    question: What CGPA does an undergraduate need to stay off academic warning?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "5.4"}
    expect: "2.00"
    # PDF p.24 (printed p.18): "Minimum CGPA required to avoid academic warning is 2.00 for all undergraduate programs."

  - id: q02
    type: ordinary
    question: What is the maximum time limit to complete a Bachelor's degree?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "1.23"}
    expect: "6 years"
    # PDF p.10 (printed p.4): "a maximum time limit of 6 years, further extendable for one year with the approval of Statutory Bodies."

  - id: q03
    type: ordinary
    question: What is the tuition fee per credit hour for BS students for the academic year 2026-27?
    relevant:
      - {source: fee-structure-page.html, section: "Tuition Fee"}
    expect: "Rs. 12,000"
    # Web page, heading "Tuition Fee (w.e.f. Fall 2026 semester)": table row "BBA / BS  Rs. 12,000".

  - id: q04
    type: ordinary
    question: What percentage of tuition fee is refunded if a student withdraws by the 15th day after classes begin?
    relevant:
      - {source: fee-structure-page.html, section: "Fee Refund Policy"}
    expect: "80%"
    # Web page, "Fee Refund Policy" table: "Upto 15th day of commencement of classes | 80% Fee Refund".

  - id: q05
    type: ordinary
    question: Is it allowed to submit content generated by an AI tool without citing it?
    relevant:
      - {source: student-handbook-jun-2026.pdf, section: "5. Unacceptable Uses of Generative AI Tools"}
    expect: "not allowed"
    # PDF p.52 (printed p.44), item 2 of misuse examples: "Submitting content generated by Generative AI tools
    # without appropriate and correctly presented acknowledgement and citation of the source(s)."
