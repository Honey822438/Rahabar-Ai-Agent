apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# cd.yml sets newName (Docker Hub) and newTag (the commit SHA) with `kustomize edit set image`.
images:
  - { name: rahbar-api, newTag: set-by-cd }
  - { name: rahbar-ui, newTag: set-by-cd }
  - { name: rahbar-indexer, newTag: set-by-cd }
