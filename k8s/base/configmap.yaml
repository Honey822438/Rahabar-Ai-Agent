apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  # Stub phase. Task 2.6 switches these three to chroma / hosted / nomic-embed-text.
  RETRIEVER: "stub"
  LLM_PROVIDER: "stub"
  # The embedding pin: the one key both the api and the indexer read.
  EMBED_MODEL: "dummy-768"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  TOP_K: "5"
  # Provisional until measured on the golden set (task 2.5).
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  RELEVANCE_FLOOR: "0.5"
  CACHE_THRESHOLD: "0.95"
  # 0.2: answers are facts in strict JSON, so low randomness; it does not prevent hallucination.
  TEMPERATURE: "0.2"
  LLM_MODEL: "gemini-flash-lite-latest"
  HOSTED_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"
