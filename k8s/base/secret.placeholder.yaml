# Documents the Secret's shape only. NEVER list this in kustomization.yaml: applying it
# would overwrite the real Secret. Create the real one with:
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="..."
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
  GROQ_API_KEY: REPLACE_ME
